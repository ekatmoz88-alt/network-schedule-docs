<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Illustrative network topology fragment</title><desc id="desc">Node 1 connects to Switch A and Switch A connects to Switch B. Dashed connections are unverified examples.</desc>
<defs><style>.node{fill:#eef6ff;stroke:#2867a5;stroke-width:2}.sw{fill:#e9f7ef;stroke:#238636;stroke-width:2}.label{font:16px sans-serif;fill:#172b4d}.hint{font:13px sans-serif;fill:#57606a}.line{stroke:#57606a;stroke-width:3;fill:none}.unknown{stroke:#8c959f;stroke-width:2;stroke-dasharray:8 7;fill:none}</style></defs>
<rect x="30" y="100" width="150" height="80" rx="12" class="node"/><text x="105" y="145" text-anchor="middle" class="label">Node 1</text><rect x="340" y="100" width="170" height="80" rx="12" class="sw"/><text x="425" y="145" text-anchor="middle" class="label">Switch A</text><rect x="670" y="100" width="170" height="80" rx="12" class="sw"/><text x="755" y="145" text-anchor="middle" class="label">Switch B</text>
<path d="M180 140 H340 M510 140 H670" class="line"/><path d="M425 100 V45 H105 V100 M755 180 V240 H425 V180" class="unknown"/><text x="450" y="25" text-anchor="middle" class="hint">Dashed: unverified illustrative connections</text><text x="450" y="280" text-anchor="middle" class="hint">Conceptual fragment only — not a verified bench wiring diagram</text></svg>
