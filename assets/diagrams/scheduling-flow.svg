<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220" role="img" aria-labelledby="title desc">
<title id="title">Conceptual scheduling workflow</title><desc id="desc">Topology and traffic inputs feed a scheduling step which produces a time-slot schedule.</desc>
<defs><style>.step{fill:#f6f8fa;stroke:#57606a;stroke-width:2}.label{font:16px sans-serif;fill:#24292f}.sub{font:12px sans-serif;fill:#57606a}.arrow{stroke:#57606a;stroke-width:2;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#57606a" stroke-width="1.3"/></marker></defs>
<rect x="20" y="65" width="190" height="85" rx="10" class="step"/><text x="115" y="100" text-anchor="middle" class="label">Topology</text><text x="115" y="123" text-anchor="middle" class="sub">nodes / links</text><path d="M210 107 H275" class="arrow"/><rect x="280" y="65" width="190" height="85" rx="10" class="step"/><text x="375" y="100" text-anchor="middle" class="label">Traffic inputs</text><text x="375" y="123" text-anchor="middle" class="sub">data volumes</text><path d="M470 107 H535" class="arrow"/><rect x="540" y="65" width="150" height="85" rx="10" class="step"/><text x="615" y="100" text-anchor="middle" class="label">Scheduler</text><text x="615" y="123" text-anchor="middle" class="sub">details unknown</text><path d="M690 107 H755" class="arrow"/><rect x="760" y="65" width="125" height="85" rx="10" class="step"/><text x="822" y="100" text-anchor="middle" class="label">Schedule</text><text x="822" y="123" text-anchor="middle" class="sub">time slots</text><text x="450" y="195" text-anchor="middle" class="sub">Conceptual reconstruction; internal algorithm and exact processing order are not confirmed</text></svg>
